<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gist</title>
<style>
  :root{color-scheme:light dark;--bg:#f8f6f1;--fg:#1f1f1d;--muted:#7a776f;--line:#e4e0d6}
  @media (prefers-color-scheme:dark){:root{--bg:#121212;--fg:#e8e6e1;--muted:#8d8a83;--line:#2a2a28}}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg)}
  body{display:grid;place-items:center;font:16px/1.6 -apple-system,"PingFang SC",sans-serif;-webkit-user-select:none;user-select:none}
  main{text-align:center;padding:24px;max-width:300px}
  h1{font:600 44px/1 Georgia,"Times New Roman",serif;letter-spacing:-.02em;margin:0 0 18px}
  p{margin:0 0 26px;color:var(--muted);font-size:15px}
  button{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:10px 26px;font:inherit;font-size:15px}
  button:active{transform:scale(.97)}
</style>
</head>
<body>
<main>
  <h1>Gist</h1>
  <p>连不上网络，检查一下网络后再试一次。</p>
  <button type="button" onclick="location.replace('https://gist.kkpcenluv.fun')">重新加载</button>
</main>
<script>try{window.Capacitor&&Capacitor.nativePromise("SplashScreen","hide",{fadeOutDuration:250})}catch(e){}</script>
</body>
</html>
